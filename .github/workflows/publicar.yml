# Renderiza o site com Quarto e publica no GitHub Pages.
# - Em qualquer branch: só renderiza (serve de teste; nada é publicado).
# - Em main: renderiza e publica. Só funciona com o Pages configurado
#   para "GitHub Actions" (Settings → Pages → Source).
name: Publicar site

on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: 1.8.25   # mesma versão do RStudio local

      - name: Renderizar o site
        run: quarto render

      - name: Conferir a saída
        run: |
          test -f docs/index.html
          test -f docs/residencia/lembrar/index.html
          test -f docs/search.json
          echo "Páginas geradas: $(find docs -name '*.html' | wc -l)"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: render
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
